[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfolio-lab"
version = "0.1.0"
description = "End-to-end quantitative research platform with backtesting, risk sizing, FastAPI and Streamlit."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{name = "Quantfolio Lab Contributors"}]
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
    "yfinance>=0.2.50,<1",
    "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1"
]

test = [
    "pytest>=8,<9",
    "httpx>=0.27,<1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
